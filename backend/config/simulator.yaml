# Simulator: clock, sources, personas, rep behavior, history.
start_time: "2026-10-05T09:00:00Z"
seed: 42
tick_minutes: 60             # live time_tick interval (decay, stalls, reassignment)
warmup_tick_minutes: 360     # coarser ticks while fast-forwarding the warm-up period
real_step_ms: 200            # real-time loop granularity
speeds: [1, 10, 60, 600]
default_speed: 60
autostart: true
warmup_days: 21              # open leads are generated by simulating this many days before start_time
lead_rate_per_day: 7.5       # average new (non-bot) leads per simulated day
bot_bursts_per_week: 0.7
bot_burst_size: [6, 14]
history_months: 6
history_deals_per_rep_month: 14
rep_actions: true            # simulated reps act on their queues

sources:
  website:        {channel: inbound,  share: 0.26, capture: form_submit, cost_per_lead: 40,
                   personas: {hot_buyer: 0.16, slow_burner: 0.20, reviver: 0.10, tire_kicker: 0.24, ghoster: 0.10, buying_committee: 0.10, duplicate_submitter: 0.10}}
  google_ads:     {channel: paid,     share: 0.20, capture: ad_lead, cost_per_lead: 85,
                   personas: {hot_buyer: 0.12, slow_burner: 0.18, reviver: 0.10, tire_kicker: 0.32, ghoster: 0.10, buying_committee: 0.06, duplicate_submitter: 0.12}}
  referral:       {channel: referral, share: 0.07, capture: referral, cost_per_lead: 20,
                   personas: {hot_buyer: 0.35, slow_burner: 0.25, ghoster: 0.15, buying_committee: 0.15, tire_kicker: 0.10}}
  trade_show:     {channel: event,    share: 0.08, capture: badge_scan, cost_per_lead: 120,
                   personas: {hot_buyer: 0.12, slow_burner: 0.30, reviver: 0.15, tire_kicker: 0.25, ghoster: 0.10, buying_committee: 0.08}}
  partner:        {channel: partner,  share: 0.08, capture: partner_lead, cost_per_lead: 60,
                   personas: {hot_buyer: 0.22, slow_burner: 0.25, ghoster: 0.15, buying_committee: 0.15, tire_kicker: 0.13, reviver: 0.10}}
  webinar:        {channel: inbound,  share: 0.10, capture: form_submit, cost_per_lead: 30,
                   personas: {slow_burner: 0.35, hot_buyer: 0.10, tire_kicker: 0.25, reviver: 0.10, buying_committee: 0.10, duplicate_submitter: 0.10}}
  cold_outreach:  {channel: outbound, share: 0.12, capture: cold_import, cost_per_lead: 15,
                   personas: {tire_kicker: 0.45, slow_burner: 0.25, ghoster: 0.15, reviver: 0.10, hot_buyer: 0.05}}
  list_vendor_x:  {channel: purchased, share: 0.09, capture: cold_import, cost_per_lead: 8,
                   personas: {tire_kicker: 0.45, duplicate_submitter: 0.35, slow_burner: 0.15, reviver: 0.05}}

# Prospect personas. Phases run in order; "daily" = expected events per day by kind.
# Kinds: page_<category>, content_download, webinar_registered, webinar_attended, demo_request, contact_sales, trial_signup
personas:
  hot_buyer:
    phases:
      - {days: 6, daily: {page_product: 0.8, page_pricing: 0.9, page_case_study: 0.3, page_roi: 0.15, page_blog: 0.2, content_download: 0.15, demo_request: 0.22, contact_sales: 0.05, page_enterprise_plan: 0.1}}
      - {days: 60, daily: {page_product: 0.15, page_pricing: 0.12, page_docs: 0.1}}
    respond: {open: 0.9, click: 0.45, reply: 0.65, reply_hours: [1, 10], connect: 0.6}
    reply_mix: {positive_intent: 0.65, neutral: 0.30, objection: 0.05}
    meeting: {accept: 0.85, no_show: 0.05}
    win_prob: 0.55
    seniority_mix: {senior: 0.6, mid: 0.35, junior: 0.05}
  slow_burner:
    phases:
      - {days: 18, daily: {page_blog: 0.35, page_product: 0.1, content_download: 0.08, webinar_registered: 0.04, page_docs: 0.1}}
      - {days: 6, daily: {page_pricing: 0.7, page_case_study: 0.35, page_competitor_compare: 0.15, demo_request: 0.12, page_product: 0.4}}
      - {days: 60, daily: {page_product: 0.1, page_blog: 0.1}}
    respond: {open: 0.7, click: 0.25, reply: 0.35, reply_hours: [4, 48], connect: 0.4}
    reply_mix: {positive_intent: 0.45, neutral: 0.40, objection: 0.15}
    meeting: {accept: 0.7, no_show: 0.12}
    win_prob: 0.35
    seniority_mix: {senior: 0.4, mid: 0.45, junior: 0.15}
  reviver:
    phases:
      - {days: 2, daily: {page_blog: 0.6, page_product: 0.4}}
      - {days: 25, daily: {}}
      - {days: 2, daily: {page_pricing: 1.6, demo_request: 0.4, page_case_study: 0.3}}
      - {days: 60, daily: {page_product: 0.15, page_pricing: 0.1}}
    respond: {open: 0.5, click: 0.15, reply: 0.3, reply_hours: [2, 24], connect: 0.35}
    reply_mix: {positive_intent: 0.55, neutral: 0.35, objection: 0.10}
    meeting: {accept: 0.75, no_show: 0.1}
    win_prob: 0.4
    seniority_mix: {senior: 0.5, mid: 0.4, junior: 0.1}
  tire_kicker:
    phases:
      - {days: 30, daily: {page_blog: 0.6, page_docs: 0.4, page_careers: 0.05, content_download: 0.05}}
      - {days: 60, daily: {page_blog: 0.1}}
    respond: {open: 0.4, click: 0.05, reply: 0.04, reply_hours: [24, 96], connect: 0.15}
    reply_mix: {neutral: 0.4, objection: 0.3, negative: 0.3}
    meeting: {accept: 0.2, no_show: 0.4}
    win_prob: 0.03
    seniority_mix: {senior: 0.1, mid: 0.4, junior: 0.5}
  ghoster:
    phases:
      - {days: 8, daily: {page_product: 0.6, page_pricing: 0.6, page_case_study: 0.2, demo_request: 0.15, content_download: 0.1}}
      - {days: 60, daily: {page_product: 0.08}}
    respond: {open: 0.85, click: 0.35, reply: 0.6, reply_hours: [2, 16], connect: 0.55}
    reply_mix: {positive_intent: 0.6, neutral: 0.35, objection: 0.05}
    meeting: {accept: 0.85, no_show: 0.08}
    win_prob: 0.05
    ghost_after: proposal_sent    # goes silent after this rep event
    seniority_mix: {senior: 0.5, mid: 0.4, junior: 0.1}
  buying_committee:
    phases:
      - {days: 14, daily: {page_product: 0.4, page_pricing: 0.35, page_case_study: 0.2, content_download: 0.1, page_enterprise_plan: 0.1, demo_request: 0.06}}
      - {days: 60, daily: {page_product: 0.1}}
    respond: {open: 0.8, click: 0.3, reply: 0.45, reply_hours: [2, 24], connect: 0.45}
    reply_mix: {positive_intent: 0.55, neutral: 0.35, objection: 0.10}
    meeting: {accept: 0.8, no_show: 0.06}
    win_prob: 0.45
    committee_size: [2, 4]
    committee_spread_days: 14
    seniority_mix: {senior: 0.5, mid: 0.4, junior: 0.1}
  duplicate_submitter:
    phases:
      - {days: 10, daily: {page_product: 0.4, page_pricing: 0.3, content_download: 0.12, page_blog: 0.2}}
      - {days: 60, daily: {page_product: 0.08}}
    respond: {open: 0.7, click: 0.25, reply: 0.35, reply_hours: [2, 24], connect: 0.4}
    reply_mix: {positive_intent: 0.5, neutral: 0.4, objection: 0.1}
    meeting: {accept: 0.7, no_show: 0.1}
    win_prob: 0.3
    resubmit_days: [1, 6]
    seniority_mix: {senior: 0.3, mid: 0.5, junior: 0.2}
  bot:
    phases: [{days: 1, daily: {}}]
    respond: {open: 0, click: 0, reply: 0, reply_hours: [1, 2], connect: 0}
    reply_mix: {neutral: 1.0}
    meeting: {accept: 0, no_show: 1}
    win_prob: 0
    seniority_mix: {junior: 1.0}

# How fast reps act on their top next-best-action (minutes, log-uniform), and how often they skip it.
rep_profiles:
  fast:       {delay_minutes: [8, 50],     skip: 0.02, close_ghosts_after_days: 21}
  average:    {delay_minutes: [45, 300],   skip: 0.05, close_ghosts_after_days: 30}
  slow:       {delay_minutes: [240, 1200], skip: 0.10, close_ghosts_after_days: 40}
  neglectful: {delay_minutes: [1500, 4000], skip: 0.40, close_ghosts_after_days: 60}

decision_days: [2, 9]          # prospect decision delay after contract_sent
lost_reasons: [price, competitor, no_decision, timing, no_budget]
